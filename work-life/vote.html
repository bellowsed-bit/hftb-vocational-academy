<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Vocational Services Academy…</title></head>
<body style="margin:0;background:#05090d;color:#fff;font-family:Arial,sans-serif"><p style="padding:24px">Loading course…</p>
<script>
fetch("../public/work-life/vote.html")
  .then(function(response){if(!response.ok)throw new Error("Course file unavailable");return response.text();})
  .then(function(html){
    html=html.replaceAll('href="/"','href="../index.html"');
    document.open();document.write(html);document.close();
  })
  .catch(function(){document.body.innerHTML='<p style="padding:24px">The course could not load. <a style="color:#45a8df" href="../index.html">Return to Academy Home</a></p>';});
</script></body></html>
