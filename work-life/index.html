<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Homes for the Brave Vocational Services Academy</title><style>:root{--navy:#12395b;--blue:#1d5f8f;--green:#2f6b4f;--purple:#68439b;--bg:#f4f7fa;--card:#fff;--text:#17212b;--muted:#5d6a76;--border:#d5dde5}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}header{background:#fff;border-bottom:5px solid var(--navy);padding:22px 16px}.brand{max-width:1040px;margin:auto;display:flex;align-items:center;gap:22px}.brand img{width:120px;height:150px;object-fit:contain}.brand h1{color:var(--navy);font-size:2rem;margin:0}.brand h2{color:#b12432;font-size:1.2rem;margin:.2rem 0}.brand p{margin:.4rem 0;color:var(--muted)}main{max-width:1040px;margin:auto;padding:26px 16px 50px}.notice{background:#eef5fa;border:1px solid #c7dbe9;border-radius:12px;padding:15px 17px;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 3px 10px rgba(18,57,91,.07);display:flex;flex-direction:column}.badge{display:inline-block;color:#fff;font-weight:700;border-radius:7px;padding:5px 10px;width:max-content}.m1{background:var(--blue)}.m2{background:var(--green)}.m3{background:var(--purple)}.card h3{color:var(--navy);font-size:1.3rem;margin:14px 0 8px}.card p{flex:1}.start{display:block;text-align:center;text-decoration:none;color:#fff;background:var(--navy);font-weight:700;border-radius:9px;padding:12px;margin-top:12px}.guide{margin-top:24px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px}.small{font-size:.88rem;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px}@media(max-width:760px){.cards{grid-template-columns:1fr}.brand{align-items:flex-start}.brand img{width:85px;height:108px}.brand h1{font-size:1.45rem}}
.educational-panel{
  background:#fff;border:2px solid #c7d8e6;border-left:7px solid var(--navy);
  border-radius:14px;padding:22px;margin-bottom:24px;box-shadow:0 3px 10px rgba(18,57,91,.06)
}
.educational-panel h2{color:var(--navy);margin:0 0 10px}
.educational-panel h3{color:#b12432;margin:18px 0 8px}
.educational-panel ul{margin:8px 0 14px;padding-left:24px}
.educational-panel .mission{background:#f4f7fa;border-radius:9px;padding:12px 14px;font-weight:700}
.acknowledge{display:flex;align-items:flex-start;gap:10px;margin-top:17px;font-weight:700}
.acknowledge input{width:21px;height:21px;margin-top:2px;flex:0 0 auto}
.continue-btn{
  display:inline-block;margin-top:14px;border:0;border-radius:9px;padding:12px 18px;
  background:var(--navy);color:#fff;font-weight:700;font-size:1rem;cursor:pointer
}
.continue-btn:disabled{background:#9ca9b4;cursor:not-allowed}
#academyModules.locked{opacity:.45;pointer-events:none;filter:grayscale(.25)}

</style>
<style>
.permanent-voting{
  background:#fff;border:2px solid #c7d8e6;border-left:7px solid var(--navy);
  border-radius:16px;padding:22px;margin:26px 0;box-shadow:0 3px 10px rgba(18,57,91,.07)
}
.permanent-voting h2{margin:0 0 8px;color:var(--navy)}
.permanent-voting .vote-note{background:#eef5fa;border-radius:10px;padding:12px 14px;margin:14px 0}
.permanent-voting .vote-button{
  display:block;text-align:center;text-decoration:none;background:var(--navy);
  color:#fff;font-weight:700;border-radius:10px;padding:14px 18px;margin:18px 0
}
</style>

<style>
.preview-card{border:2px dashed #6b4aa0!important;background:#fbf8ff!important}
.preview-badge{display:inline-block;background:#6b4aa0;color:#fff;border-radius:7px;padding:5px 10px;font-size:.8rem;font-weight:700;margin-bottom:8px}
.preview-note{background:#fff7d6;border:1px solid #e4cf7a;border-radius:10px;padding:12px 14px;margin:18px 0}
</style>
